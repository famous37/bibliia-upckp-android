name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check edition
        run: python3 tools/check_edition.py
      - name: Install Android 17 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-37.0;google_apis;x86_64'
      - name: Build and lint
        run: ./gradlew --console=plain :app:lintRelease :app:assembleRelease :app:assembleDebug
      - name: Launch reader on Android 17
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/bible-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          image='system-images;android-37.0;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name bible --package "$image" --device pixel_6 --path "$ANDROID_AVD_HOME/bible.avd"
          test -s "$ANDROID_AVD_HOME/bible.avd/config.ini"
          if [ ! -s "$ANDROID_AVD_HOME/bible.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s/bible.avd\ntarget=android-37.0\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/bible.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -avd bible -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb start-server
          for attempt in {1..160}; do
            kill -0 "$emulator_pid" 2>/dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -qx 1 || { tail -100 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb root
          adb wait-for-device
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 1800000
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install app/build/outputs/apk/debug/app-debug.apk
          python3 tools/smoke_android.py
